# Example configuration for the RGB/Depth -> HHA pipeline

paths:
  raw_dir: ./data/raw
  processed_dir: ./data/processed

inpainting:
  # Supported: linear_nearest, rbf, none
  method: linear_nearest

augmentation:
  enabled: true
  seed: 42
  seeds: [41, 42, 43, 44, 45]
  horizontal_flip_prob: 0.5
  random_scale_limit: 0.1
  crop_size: [800, 600]
  rotate_limit: 15
  pad_if_needed: true

cameras:
  # Intrinsic matrices parameters are required for HHA conversion
  rgb_camera_matrix:
    fx: 692.683
    fy: 692.738
    cx: 408.508
    cy: 295.696
  depth_camera_matrix:
    fx: 712.929
    fy: 712.808
    cx: 396.903
    cy: 295.821

hha:
  # ROI specified in fractions of image size
  bottom_band_frac: 0.25
  side_band_frac: 0.05
  center_exclude_width_frac: 0.40
  # RANSAC params (centimetres in vendor code)
  ransac_thresh_cm: 1.5
  min_inlier_ratio: 0.12
  ransac_seed: 42
  gravity_init: -z

outputs:
  save_hha_channels_jet: true
  enable_train_export: true
  train_dir: data/train
  save_hha_u8_in_train: false
  enable_processed_export: false

# Placeholder config. Will be filled in later.

